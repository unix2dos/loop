<body>
<a class="skip-link" href="#task">跳到任务输入</a>
<header class="topbar"><div class="brand"><button class="brand-home" data-home aria-label="返回所有任务"><span class="brand-mark" aria-hidden="true"><img src="/icon.png" alt=""></span><h1>Loop</h1></button><small>运行 Agent，看清每一步。</small></div><div class="top-meta"><button class="quiet-button" data-settings>设置</button></div></header>
<main><div class="app-shell" id="app-shell">
<aside class="sidebar" aria-label="任务侧栏"><div class="sidebar-heading"><h2>任务</h2><div class="sidebar-actions"><button class="icon-button" data-home aria-label="所有任务" title="所有任务">☷</button></div><button class="icon-button" id="sidebar-toggle" aria-label="收起任务侧栏" aria-expanded="true" aria-controls="task-list">‹</button></div><button class="new-task-button" data-new-task title="新任务" aria-label="新任务"><b>＋</b><span>新任务</span></button><nav class="task-list" id="task-list" aria-label="运行记录列表"><p class="list-empty">正在读取任务…</p></nav><footer class="sidebar-footer"><span id="task-count"></span><p id="history-note"></p></footer></aside>
<div class="main-views">
<section class="task-home" id="task-home" aria-label="所有任务总览"><header class="home-heading"><div><span class="eyebrow">LOOP / 本地工作台</span><h2>所有任务</h2><p id="home-count">正在读取记录…</p></div><div class="home-actions"><button class="quiet-button" id="refresh-tasks">刷新列表</button><button class="primary" data-new-task>＋ 新任务</button></div></header><div class="home-columns"><span>任务 / 模型</span><span>状态</span><span>创建时间</span><span></span></div><div id="home-task-list"></div><p class="home-note" id="home-note">选择一项查看回答和执行记录，或新建一个只读任务。查看历史不会再次调用模型。</p></section>
<section class="task-home" id="settings" hidden aria-label="设置"><header class="home-heading"><div><span class="eyebrow">LOOP / 设置</span><h2>设置</h2><p>这些选项只作用于之后新提交的一轮。</p></div><button class="quiet-button" data-leave-settings>返回</button></header><label class="setting-row"><span><strong>本轮请求上限</strong><small>这一轮最多几次模型请求，不是工具调用次数。</small></span><select id="budget" aria-label="本轮模型请求上限"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label></section>
<div class="workbench" id="workbench" hidden>
<section class="conversation-pane" id="conversation-pane" aria-label="任务与回答"><header class="pane-heading"><div class="section-title"><h2 id="conversation-title">新任务</h2><small id="mode-label">对话与只读工具</small></div><button class="trace-summary" id="trace-summary" data-toggle-trace aria-controls="trace-pane" aria-expanded="true">执行过程 · 尚未运行</button></header><div class="conversation" id="conversation"></div><form class="composer" id="task-form"><div class="composer-inner"><div class="error-box" id="error" role="alert" hidden></div><p class="composer-note" id="coding-consent" hidden>点击“授权并运行练习”，允许 Loop 只修改本次独立项目的 average.ts，并在断网容器内运行测试。测试文件受保护。</p><textarea id="task" maxlength="4000" required aria-label="任务"></textarea><div class="composer-actions"><span class="model-label" id="model-label">正在连接</span><button id="submit" class="primary" disabled>开始任务 →</button></div><p class="composer-note access" id="access"></p></div></form></section>
<div id="trace-resize" class="trace-resize" role="separator" tabindex="0" aria-label="调整对话与执行轨迹宽度" aria-orientation="vertical" aria-controls="conversation-pane trace-pane" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65" title="左右拖动调整宽度，双击恢复默认；也可用左右方向键调整"></div>
<section class="trace-pane" id="trace-pane" aria-label="紧凑执行轨迹"><header class="trace-heading"><div class="trace-heading-top"><h2 id="trace-title">执行轨迹</h2><span class="metrics" id="metrics">提交任务后显示用量与耗时</span><div class="trace-actions"><span class="status" id="status" aria-live="polite">等待任务</span><button class="icon-button" id="trace-toggle" data-toggle-trace aria-label="收起轨迹栏" aria-controls="trace-pane" aria-expanded="true" title="收起轨迹栏">›</button></div></div><div class="trace-view-tools"><button class="quiet-button" id="follow-latest" hidden title="回到当前运行的最新事件。只影响浏览，不会重跑任务。">回到最新</button><button class="quiet-button" id="download" disabled>导出 ↓</button></div><span class="sr-only" id="run-id"></span><p class="sr-only" id="workspace-label"></p><div class="timeline" id="timeline" aria-label="整段对话的分轨概览"></div><div class="stream-header"><span id="event-count">完整事件流 · 0 条</span><span>点击色块定位事件</span></div></header><div class="graph-scroll" id="graph-scroll"><div class="graph" id="graph"></div></div><div id="detail-resize" class="detail-resize" role="separator" tabindex="0" aria-label="上下调整轨迹与记录高度" aria-orientation="horizontal" aria-controls="graph-scroll detail-content" aria-valuemin="0" aria-valuemax="100" aria-valuenow="58" title="上下拖动调整高度，双击恢复默认；也可用上下方向键调整"></div><aside class="inspector" aria-label="选中步骤的原始记录"><div class="detail-heading" id="detail-heading"><h2>选择一个步骤查看原始记录</h2></div><div class="detail-content" id="detail-content" role="tabpanel"></div></aside></section><aside class="trace-rail" aria-label="已收起的轨迹栏"><button data-toggle-trace aria-label="展开轨迹栏">‹ 执行过程</button></aside>
</div></div></div></main>
<script type="module" src="/app.js"></script>
</body></html>
