@media(max-width:900px){main{padding:0 8px 10px}.topbar{height:54px;padding:0 12px}.app-shell,.app-shell.sidebar-collapsed{grid-template-columns:48px minmax(0,1fr);height:calc(100dvh - 64px);min-height:570px}.sidebar{position:absolute;inset:0 auto 0 0;width:260px;z-index:3;box-shadow:8px 0 20px #33472618}.sidebar-collapsed .sidebar{position:relative;width:auto;box-shadow:none}.main-views{grid-column:2}.workbench{grid-template-columns:minmax(0,1.4fr) minmax(270px,1fr)}.pane-heading{padding:15px 17px}.conversation{padding:19px 17px}.composer{padding:13px 17px}.top-meta .local-mark{display:none}.task-home{padding:24px 20px}.home-columns{display:none}.home-task{grid-template-columns:minmax(0,1fr) 85px;gap:10px;padding:14px 2px}.home-task>time,.home-task>span:last-child{display:none}.home-heading{align-items:flex-start}.home-actions{gap:6px}.home-heading h2{font-size:22px}}
@media(max-width:650px){.workbench,.workbench.trace-collapsed{display:flex;flex-direction:column;height:auto;min-height:100%}.main-views{overflow:auto}.conversation-pane{border-right:0;border-bottom:1px solid var(--line);flex-shrink:0}.conversation{min-height:190px;max-height:430px;padding:18px 15px}.message>p{font-size:13px}.composer{padding:12px 15px}.trace-pane{min-height:420px;grid-template-rows:auto minmax(220px,1fr) 42px;flex-shrink:0}.trace-pane.detail-open{grid-template-rows:auto 270px 400px}.graph-scroll{max-height:480px}.trace-collapsed .trace-rail{padding:8px}.trace-rail button{writing-mode:horizontal-tb;letter-spacing:0;width:100%}.task-home{padding:20px 14px}.home-heading{flex-wrap:wrap;gap:12px;padding-bottom:17px}.home-heading h2{font-size:21px}.home-task{grid-template-columns:minmax(0,1fr);gap:7px}.home-task>span:first-child{min-width:0}.home-task strong{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px}.home-task .task-state{font-size:9px}.home-task small{font-size:8px}.model-label{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.app-shell{border-radius:8px}.composer-label span{font-size:8px}textarea{font-size:11px;min-height:83px}.detail-content{max-height:360px}.welcome h3{font-size:23px}.trace-summary{font-size:9px}.section-title h2{min-width:0;font-size:13px}}
</style>
</head>
<body>
<a class="skip-link" href="#task">跳到任务输入</a>
<header class="topbar"><div class="brand"><button class="brand-home" data-home aria-label="返回所有任务"><span class="brand-mark" aria-hidden="true">↻</span><h1>Loop</h1></button><small>运行 Agent，看清每一步。</small></div><div class="top-meta"><span class="local-mark">本地学习工作台</span><span class="model-label" id="model-label">正在连接</span></div></header>
<main><div class="app-shell" id="app-shell">
<aside class="sidebar" aria-label="任务侧栏"><div class="sidebar-heading"><h2>任务</h2><div class="sidebar-actions"><button class="icon-button" data-home aria-label="所有任务" title="所有任务">☷</button></div><button class="icon-button" id="sidebar-toggle" aria-label="收起任务侧栏" aria-expanded="true" aria-controls="task-list">‹</button></div><button class="new-task-button" data-new-task title="新任务" aria-label="新任务"><b>＋</b><span>新任务</span></button><input class="task-search" id="task-search" type="search" aria-label="搜索任务" placeholder="搜索任务…"><nav class="task-list" id="task-list" aria-label="运行记录列表"><p class="list-empty">正在读取任务…</p></nav><footer class="sidebar-footer"><span id="task-count"></span><p id="history-note"></p></footer></aside>
<div class="main-views">
<section class="task-home" id="task-home" aria-label="所有任务总览"><header class="home-heading"><div><span class="eyebrow">LOOP / 本地工作台</span><h2>所有任务</h2><p id="home-count">正在读取记录…</p></div><div class="home-actions"><button class="quiet-button" id="refresh-tasks">刷新列表</button><button class="primary" data-new-task>＋ 新任务</button></div></header><div class="home-columns"><span>任务 / 模型</span><span>状态</span><span>创建时间</span><span></span></div><div id="home-task-list"></div><p class="home-note" id="home-note">选择一项查看回答和执行记录，或新建一个只读任务。查看历史不会再次调用模型。</p></section>
<div class="workbench" id="workbench" hidden>
<section class="conversation-pane" aria-label="任务与回答"><header class="pane-heading"><div class="section-title"><h2 id="conversation-title">新任务</h2><small>只读实验</small></div><button class="trace-summary" id="trace-summary" data-toggle-trace aria-controls="trace-pane" aria-expanded="true">执行过程 · 尚未运行</button></header><div class="conversation" id="conversation"></div><form class="composer" id="task-form"><div class="composer-inner"><div class="error-box" id="error" role="alert" hidden></div><div class="composer-label"><label for="task">提交新任务</label><span>每次运行独立记录</span></div><textarea id="task" maxlength="4000" required aria-label="只读任务" placeholder="让 Agent 阅读笔记，带着原文回答一个问题。"></textarea><div class="composer-actions"><label class="budget-label">模型请求上限<select id="budget" aria-label="模型请求上限"><option>1</option><option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><button id="submit" class="primary" disabled>运行任务 →</button></div><p class="composer-note">每次提交开启新任务。连续追问与教学问答将在后续阶段接入。</p><p class="composer-note access" id="access"></p></div></form></section>
<section class="trace-pane" id="trace-pane" aria-label="紧凑执行轨迹"><header class="trace-heading"><div class="trace-heading-top"><h2>执行过程</h2><div class="trace-actions"><span class="status" id="status" aria-live="polite">等待任务</span><button class="icon-button" id="trace-toggle" data-toggle-trace aria-label="收起轨迹栏" aria-controls="trace-pane" aria-expanded="true" title="收起轨迹栏">›</button></div></div><span class="metrics" id="metrics">提交任务后显示用量与耗时</span><div class="trace-toolbar"><label class="follow"><input id="follow" type="checkbox">跟随执行</label><span class="run-id" id="run-id"></span><button class="quiet-button" id="download" disabled>导出 JSON ↓</button></div><p class="workspace-label" id="workspace-label"></p></header><div class="graph-scroll" id="graph-scroll"><div class="graph" id="graph"></div><details class="records"><summary>全部事件 <span id="event-count">尚无记录</span></summary><div class="records-content"><input type="search" class="search" id="search" aria-label="搜索事件或工具" placeholder="查找事件、工具或文件名…"><div id="event-list"></div></div></details></div><aside class="inspector" aria-label="选中步骤的原始记录"><div class="detail-heading" id="detail-heading"><h2>选择一个步骤查看原始记录</h2></div><div class="detail-content" id="detail-content" role="tabpanel"></div></aside></section><aside class="trace-rail" aria-label="已收起的轨迹栏"><button data-toggle-trace aria-label="展开轨迹栏">‹ 执行过程</button></aside>
</div></div></div></main>
<script type="module" src="/app.js"></script>
</body></html>
